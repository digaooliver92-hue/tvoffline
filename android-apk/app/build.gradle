apply plugin: 'com.android.application'

android {
    namespace 'com.tvdigao.tvoffline'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.tvdigao.tvoffline"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 3
        versionName "3.0"
    }

    signingConfigs {
        release {
            def ks = file("release.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword "tvofflinepass"
                keyAlias "tvoffline"
                keyPassword "tvofflinepass"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {}
