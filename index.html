<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TV Offline</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000">
<style>
:root{--fg:#f2f2f2;--mut:#9aa0a6;--ac:#ffb000;--pn:#16181b;--ln:#33363b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--fg);font:16px/1.4 system-ui,sans-serif;overflow:hidden}
video{position:fixed;top:50%;left:50%;background:#000;opacity:0;transition:opacity .2s}video.on{opacity:1}
#hud{position:fixed;left:10px;bottom:10px;font-size:13px;background:#000b;color:#fff;padding:5px 10px;border-radius:6px;opacity:0;transition:opacity .5s;pointer-events:none;max-width:80vw}
#menu{position:fixed;inset:0;background:#000e;display:none;overflow:auto;padding:16px}#menu.on{display:block}
.pn{max-width:620px;margin:0 auto;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:16px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);margin:4px 0 12px;font-size:14px}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut)}
input,select,button{width:100%;font:inherit;color:var(--fg);background:#0c0d0f;border:1px solid var(--ln);border-radius:6px;padding:12px}
button{cursor:pointer;background:#22252a;margin-top:8px}button.pri{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}
input:focus,select:focus,button:focus{outline:3px solid var(--ac);outline-offset:1px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#ls{margin:12px 0 0;padding:0;list-style:none;font-size:14px;max-height:32vh;overflow:auto}#ls li{padding:4px 0;border-top:1px solid var(--ln);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<video id="a" playsinline muted autoplay></video><video id="b" playsinline muted autoplay></video>
<div id="hud"></div>
<div id="menu"><div class="pn">
<h1>TV Offline</h1><p id="st"></p>
<label for="url">Link da lista M3U</label><input id="url" type="url" placeholder="http://seuservidor/live/tv24h.m3u" inputmode="url">
<button class="pri" id="salvar">Salvar e baixar vídeos</button>
<label for="arq">Ou escolha um arquivo .m3u do aparelho</label><input id="arq" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl">
<div class="g"><div><label for="aj">Ajuste</label><select id="aj"><option value="conter">Barras pretas</option><option value="cobrir">Preencher</option></select></div>
<div><label for="rot">Girar vídeo</label><select id="rot"><option value="0">Não girar</option><option value="90">90° (TV virada)</option><option value="270">270°</option></select></div>
<div><label for="som">Som</label><select id="som"><option value="1">Ligado</option><option value="0">Mudo</option></select></div></div>
<button id="sync">Sincronizar agora</button><button id="limpa">Apagar vídeos baixados</button><button id="fecha">Voltar ao vídeo</button>
<ul id="ls"></ul></div></div>
<script>
const $=s=>document.querySelector(s),V=[$('#a'),$('#b')],P=new URLSearchParams(location.search);
let C={lista:'',ajuste:'conter',rot:'0',som:'1',...JSON.parse(localStorage.tvo||'{}')};
for(const k of['lista','ajuste','rot','som'])if(P.get(k)!=null)C[k]=P.get(k);
const salvaC=()=>localStorage.tvo=JSON.stringify(C);salvaC();
let L=[],cur=0,pos=0,errs=0,mudoForcado=0,syncing=0,estado={};
const db=new Promise((ok,er)=>{const r=indexedDB.open('tvo',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,er)=>{const t=d.transaction('v',m),q=f(t.objectStore('v'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>er(t.error)})};
const dget=k=>tx('readonly',s=>s.get(k)),dput=(k,v)=>tx('readwrite',s=>s.put(v,k)),ddel=k=>tx('readwrite',s=>s.delete(k)),dkeys=()=>tx('readonly',s=>s.getAllKeys());
const fixHttps=(u,b)=>{try{if(location.protocol!='https:'||!/^https:/.test(b))return u;const x=new URL(u),l=new URL(b);if(x.protocol=='http:'&&x.pathname.startsWith(l.pathname.replace(/[^\/]*$/,'')))return l.origin+x.pathname+x.search}catch{}return u};
const parse=(t,base)=>{const o=[];let n='';for(let l of t.split(/\r?\n/)){l=l.trim();if(!l)continue;
if(l.startsWith('#EXTINF'))n=l.split(',').slice(1).join(',').trim();
else if(l[0]!='#'){let u=l;try{u=new URL(l,/^https?:/.test(base)?base:undefined).href}catch{}u=fixHttps(u,base);if(/^https?:/.test(u))o.push({url:u,nome:n||decodeURIComponent(u.split('/').pop()),live:/\.m3u8?(\?|$)/i.test(u)});n=''}}return o};
async function carregarLista(){let t=null;if(/^https?:/.test(C.lista)){try{const c=new AbortController();setTimeout(()=>c.abort(),8000);
const r=await fetch(C.lista,{cache:'no-store',signal:c.signal});if(r.ok){t=await r.text();localStorage.tvtxt=t}}catch{}}
if(t==null)t=localStorage.tvtxt||'';const n=parse(t,C.lista);if(n.length||!L.length)L=n}
const sigDe=h=>(h.get('last-modified')||'')+'|'+(h.get('content-length')||'');
async function sigRemota(u){try{const r=await fetch(u,{method:'HEAD',cache:'no-store'});return r.ok?sigDe(r.headers):null}catch{return null}}
async function baixar(it){const r=await fetch(it.url,{cache:'no-store'});if(!r.ok)throw 0;const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let n=0;
for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);n+=value.length;hud('Baixando '+it.nome+(tot?' '+Math.round(n*100/tot)+'%':''),1)}
if(tot&&n!=tot)throw 0;await dput(it.url,{blob:new Blob(ch,{type:'video/mp4'}),sig:sigDe(r.headers)})}
async function sync(pular){if(syncing)return;syncing=1;try{if(!pular)await carregarLista();
const urls=new Set(L.map(i=>i.url));if(L.length)for(const k of await dkeys())if(!urls.has(k))await ddel(k);
for(const it of L){if(it.live){estado[it.url]='ao vivo';continue}const rec=await dget(it.url),s=await sigRemota(it.url);
if(rec&&(!s||rec.sig===s)){estado[it.url]='ok';continue}if(s===null&&!rec){estado[it.url]='erro';continue}
estado[it.url]='baixando';let ok=0;for(let t=0;t<3&&!ok;t++)try{await baixar(it);ok=1}catch{await new Promise(r=>setTimeout(r,2000))}
estado[it.url]=ok?'ok':'erro'}hud('Sincronizado ✔')}catch(e){}syncing=0;if($('#menu').classList.contains('on'))desenha()}
async function carregar(el,i){const it=L[i];el._it=it;if(el._u){URL.revokeObjectURL(el._u);el._u=0}
const r=it.live?null:await dget(it.url);el.src=r?(el._u=URL.createObjectURL(r.blob)):it.url;el.loop=L.length==1;el.muted=mudoForcado||C.som=='0';el.load()}
function ajustar(el){const W=innerWidth,H=innerHeight,vw=el.videoWidth,vh=el.videoHeight;let r=0;if(vw&&+C.rot&&((vw>vh)!=(W>H)))r=+C.rot;
Object.assign(el.style,{width:(r?H:W)+'px',height:(r?W:H)+'px',objectFit:C.ajuste=='cobrir'?'cover':'contain',transform:`translate(-50%,-50%) rotate(${r}deg)`})}
async function tocarEl(el){ajustar(el);el.classList.add('on');V[1-cur].classList.remove('on');
try{await el.play()}catch{mudoForcado=1;el.muted=true;try{await el.play()}catch{}if(C.som=='1')hud('Toque na tela para ativar o som',1)}}
function prep(){if(L.length>1)carregar(V[1-cur],(pos+1)%L.length)}
async function avancar(){if(!L.length)return;pos=(pos+1)%L.length;const el=V[1-cur];if(el.error||!el.src||el._it!==L[pos])await carregar(el,pos);
cur=1-cur;await tocarEl(el);prep()}
V.forEach(el=>{el.onloadedmetadata=()=>ajustar(el);el.onplaying=()=>{if(el===V[cur])errs=0};
el.onended=()=>{if(el===V[cur]&&!el.loop)avancar()};
el.onerror=()=>{if(el!==V[cur])return;errs++;if(errs>L.length*2){hud('Sem conexão e sem vídeo baixado. Tentando de novo…',1);errs=0;setTimeout(()=>carregar(el,pos).then(()=>tocarEl(el)),10000)}else setTimeout(avancar,300)}});
addEventListener('resize',()=>V.forEach(ajustar));
async function iniciar(){if(!L.length){menu(1);return}pos=0;cur=0;await carregar(V[0],0);await tocarEl(V[0]);prep()}
let ht;function hud(m,k){const h=$('#hud');h.textContent=m;h.style.opacity=1;clearTimeout(ht);ht=setTimeout(()=>h.style.opacity=0,k?4000:2500)}
async function desenha(){$('#url').value=/^https?:/.test(C.lista)?C.lista:'';$('#aj').value=C.ajuste;$('#rot').value=C.rot;$('#som').value=C.som;
let q='';try{const e=await navigator.storage.estimate();q=' · usando '+Math.round(e.usage/1048576)+' MB'}catch{}
const ok=L.filter(i=>estado[i.url]=='ok').length;$('#st').textContent=L.length?`${L.length} itens na lista, ${ok} salvos no aparelho${q}.`:'Cole o link da sua lista M3U para começar.';
$('#ls').innerHTML='';for(const it of L){const li=document.createElement('li'),s=estado[it.url]||'';li.textContent=({ok:'✔ ',baixando:'⬇ ',erro:'✖ ','ao vivo':'📡 '}[s]||'… ')+it.nome;$('#ls').append(li)}}
function menu(on){$('#menu').classList.toggle('on',on);if(on){desenha();$('#url').focus()}}
let taps=[];addEventListener('pointerdown',e=>{if(mudoForcado){mudoForcado=0;V.forEach(v=>v.muted=C.som=='0')}
if(document.fullscreenElement==null&&!matchMedia('(display-mode: fullscreen)').matches)document.documentElement.requestFullscreen?.().catch(()=>{});
if(e.target.closest('#menu'))return;const n=Date.now();taps=taps.filter(t=>n-t<900);taps.push(n);if(taps.length>=3){taps=[];menu(1)}});
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.key!='Escape')return;
if(['Enter','m','M','ContextMenu','MediaPlayPause'].includes(e.key)&&!$('#menu').classList.contains('on')){menu(1);e.preventDefault()}else if(e.key=='Escape')menu(0)});
$('#fecha').onclick=()=>menu(0);
$('#salvar').onclick=async()=>{C.lista=$('#url').value.trim();salvaC();menu(0);hud('Lendo a lista…',1);await carregarLista();await iniciar();sync(1)};
$('#arq').onchange=async e=>{const f=e.target.files[0];if(!f)return;localStorage.tvtxt=await f.text();C.lista='arquivo';salvaC();menu(0);await carregarLista();await iniciar();sync(1)};
for(const[id,k]of[['aj','ajuste'],['rot','rot'],['som','som']])$('#'+id).onchange=e=>{C[k]=e.target.value;salvaC();V.forEach(v=>{ajustar(v);v.muted=C.som=='0'})};
$('#sync').onclick=()=>{sync();hud('Sincronizando…',1)};
$('#limpa').onclick=async()=>{if(!confirm('Apagar todos os vídeos baixados?'))return;for(const k of await dkeys())await ddel(k);estado={};desenha()};
(async()=>{navigator.serviceWorker?.register('sw.js').catch(()=>{});navigator.storage?.persist?.();
const wl=async()=>{try{await navigator.wakeLock.request('screen')}catch{}};wl();document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&wl());
await carregarLista();await iniciar();sync(1);setInterval(()=>sync(),10*60*1000);addEventListener('online',()=>sync())})();
</script></body></html>
